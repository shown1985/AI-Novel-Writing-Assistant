name: Desktop Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.release-guard.outputs.allowed }}
      version: ${{ steps.release-guard.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate public release tag and desktop version
        id: release-guard
        shell: bash
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          allowed=false
          version=""
          reason="unknown validation failure"

          if [[ "$RELEASE_EVENT_NAME" != "push" || "$RELEASE_REF_TYPE" != "tag" ]]; then
            reason="public releases require a push tag event"
          elif [[ ! "$RELEASE_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            reason="public releases require a stable vX.Y.Z tag"
          else
            version="$(node -p "require('./desktop/package.json').version")"
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "${RELEASE_REF_NAME#v}" == "$version" ]]; then
              allowed=true
            else
              reason="tag version does not match desktop/package.json"
            fi
          fi

          {
            echo "allowed=$allowed"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

          if [[ "$allowed" != "true" ]]; then
            echo "::notice::Public release validation skipped: $reason"
          fi

  publish-release:
    needs: validate-release
    if: ${{ needs.validate-release.outputs.allowed == 'true' && github.event_name == 'push' && github.ref_type == 'tag' }}
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      AI_NOVEL_RELEASE_CHANNEL: release
      AI_NOVEL_ALLOW_UNSIGNED_RELEASE: "true"
      AI_NOVEL_GITHUB_OWNER: ExplosiveCoderflome
      AI_NOVEL_GITHUB_REPO: AI-Novel-Writing-Assistant
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install desktop icon tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Regenerate desktop icon assets
        run: python desktop/scripts/generate-desktop-icons.py

      - name: Typecheck
        run: pnpm typecheck

      - name: Build and stage desktop app
        run: pnpm stage:desktop

      - name: Verify database migrations
        run: pnpm --filter @ai-novel/server exec node --test tests/prismaMigrationCompleteness.test.js tests/runtimeMigrations.test.js

      - name: Verify packaged desktop layout
        run: pnpm verify:desktop-package:reuse-stage

      - name: Publish desktop release to GitHub Releases
        run: pnpm publish:desktop:release:reuse-stage

      - name: Update GitHub release notes
        run: node scripts/update-desktop-release-notes.cjs

  macos-candidate:
    needs: validate-release
    if: ${{ needs.validate-release.outputs.allowed == 'true' && github.event_name == 'push' && github.ref_type == 'tag' }}
    permissions:
      contents: read
    runs-on: macos-15
    env:
      AI_NOVEL_LOCAL_DESKTOP_BUILD: "true"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Assert arm64 runner
        shell: bash
        run: |
          machine_arch="$(uname -m)"
          if [[ "$machine_arch" != "arm64" ]]; then
            echo "Expected macOS arm64 runner, got $machine_arch" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install desktop icon tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Regenerate desktop icon assets
        run: python desktop/scripts/generate-desktop-icons.py

      - name: Build and stage desktop app
        run: pnpm stage:desktop

      - name: Verify database migrations
        run: pnpm --filter @ai-novel/server exec node --test tests/prismaMigrationCompleteness.test.js tests/runtimeMigrations.test.js

      - name: Build macOS arm64 candidate
        run: pnpm dist:desktop:mac:reuse-stage

      - name: Verify packaged macOS arm64 candidate
        run: pnpm verify:desktop-package:mac:reuse-stage
