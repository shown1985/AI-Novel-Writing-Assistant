# 本地容器化热更开发环境
#
# 启动：pnpm docker:dev          （等价于 docker compose -f infra/docker-compose.dev.yml up --build）
# 停止：pnpm docker:dev:down
# 前端：http://localhost:5173    后端：http://localhost:3000/api
#
# - 源码以 bind mount 挂载到 /app，修改后 shared / server / client 自动热更。
# - node_modules 放在容器命名卷中，不读写宿主机的 node_modules。
# - 开发数据库默认放在命名卷 api-data 中，与宿主机 server/dev.db 隔离。
#   `docker compose ... down -v` 会删除该卷及其中的小说数据，执行前请先备份。
# - Windows 或文件变更无法触发热更时，设置 AI_NOVEL_DEV_POLLING=true 与
#   AI_NOVEL_DEV_TSC_WATCHFILE=DynamicPriorityPolling 改用轮询监听。
# - 需要 RAG 向量检索时追加 `--profile rag` 启动 Qdrant。

name: ai-novel-dev

x-dev-base: &dev-base
  build:
    context: ..
    dockerfile: infra/docker/dev.Dockerfile
  image: ai-novel-dev:local
  working_dir: /app
  init: true
  volumes:
    - ..:/app
    - node-modules-root:/app/node_modules
    - node-modules-client:/app/client/node_modules
    - node-modules-server:/app/server/node_modules
    - node-modules-shared:/app/shared/node_modules
    - node-modules-desktop:/app/desktop/node_modules
    - node-modules-site:/app/site/node_modules
    - pnpm-store:/pnpm/store
  environment:
    CHOKIDAR_USEPOLLING: ${AI_NOVEL_DEV_POLLING:-false}
    # shared 的 tsc --watch 使用；轮询模式下设为 DynamicPriorityPolling。
    TSC_WATCHFILE: ${AI_NOVEL_DEV_TSC_WATCHFILE:-UseFsEvents}

services:
  deps:
    <<: *dev-base
    command: ["sh", "infra/docker/dev-bootstrap.sh"]
    restart: "no"

  shared:
    <<: *dev-base
    command: ["sh", "infra/docker/dev-shared.sh"]
    depends_on:
      deps:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/shared-ready"]
      interval: 3s
      timeout: 2s
      retries: 100
      start_period: 5s
    restart: unless-stopped

  api:
    <<: *dev-base
    command: ["sh", "infra/docker/dev-api.sh"]
    depends_on:
      shared:
        condition: service_healthy
    environment:
      CHOKIDAR_USEPOLLING: ${AI_NOVEL_DEV_POLLING:-false}
      HOST: 0.0.0.0
      PORT: "3000"
      ALLOW_LAN: "true"
      CORS_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
      DATABASE_URL: file:/data/dev.db
      QDRANT_URL: ${AI_NOVEL_DEV_QDRANT_URL:-http://qdrant:6333}
    volumes:
      - ..:/app
      - node-modules-root:/app/node_modules
      - node-modules-client:/app/client/node_modules
      - node-modules-server:/app/server/node_modules
      - node-modules-shared:/app/shared/node_modules
      - node-modules-desktop:/app/desktop/node_modules
      - node-modules-site:/app/site/node_modules
      - pnpm-store:/pnpm/store
      - api-data:/data
      - api-tmp:/app/server/.tmp
    ports:
      - "${AI_NOVEL_DEV_API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  web:
    <<: *dev-base
    command: ["pnpm", "--filter", "@ai-novel/client", "dev", "--host", "0.0.0.0", "--port", "5173", "--strictPort"]
    depends_on:
      deps:
        condition: service_completed_successfully
    environment:
      CHOKIDAR_USEPOLLING: ${AI_NOVEL_DEV_POLLING:-false}
      # Vite 开发代理目标：把 /api 转发到 api 服务。
      HOST: api
      PORT: "3000"
      # 置空后浏览器统一走同源 /api，经 Vite 代理转发，不受宿主机 client/.env 影响。
      VITE_API_BASE_URL: ""
    ports:
      - "${AI_NOVEL_DEV_WEB_PORT:-5173}:5173"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.4
    profiles: ["rag"]
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"
    restart: unless-stopped

volumes:
  node-modules-root:
  node-modules-client:
  node-modules-server:
  node-modules-shared:
  node-modules-desktop:
  node-modules-site:
  pnpm-store:
  api-data:
  api-tmp:
  qdrant-data:
